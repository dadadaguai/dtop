[package]
name = "dtop"
version = "0.1.0"
edition = "2021"
description = "A top-like system monitor for Hygon DCU + CPU"
license = "MIT"
authors = ["dadadaguai <dadadaguai@example.com>"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
log = "0.4"
libloading = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"

[profile.release]
lto = true
strip = true
codegen-units = 1
